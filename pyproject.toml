[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-simulation-toolkit"
version = "0.2.0"
description = "Reusable rocket modeling tools and a deterministic 6-DoF flight simulator"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "plotly>=5.20",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "streamlit>=1.35",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
rocket-tool = "rocket_tool.cli:main"
rocket-geometry = "rocket_geometry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
